<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <!--
        Faz a interface se adaptar a diferentes
        tamanhos de tela.
    -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finance Dashboard</title>

    <!-- Arquivo responsável pelos estilos -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="container">

        <!-- ==========================================
             CABEÇALHO
             ========================================== -->

        <header class="header">

            <div>
                <h1>Finance Dashboard</h1>

                <p>
                    Controle suas receitas e despesas
                </p>
            </div>

        </header>


        <!-- ==========================================
             RESUMO FINANCEIRO
             ========================================== -->

        <section class="summary">

            <article class="summary-card">

                <span>Saldo</span>

                <!--
                    O JavaScript preencherá esse valor.
                -->
                <strong id="balance">
                    R$ 0,00
                </strong>

            </article>


            <article class="summary-card">

                <span>Receitas</span>

                <strong id="income">
                    R$ 0,00
                </strong>

            </article>


            <article class="summary-card">

                <span>Despesas</span>

                <strong id="expense">
                    R$ 0,00
                </strong>

            </article>

        </section>


        <!-- ==========================================
             FORMULÁRIO
             ========================================== -->

        <section class="card">

            <h2>Nova transação</h2>

            <form id="transactionForm">

                <div class="form-grid">

                    <!-- Tipo -->

                    <div class="form-group">

                        <label for="type">
                            Tipo
                        </label>

                        <select id="type" required>

                            <option value="">
                                Selecione
                            </option>

                            <option value="income">
                                Receita
                            </option>

                            <option value="expense">
                                Despesa
                            </option>

                        </select>

                    </div>


                    <!-- Categoria -->

                    <div class="form-group">

                        <label for="category">
                            Categoria
                        </label>

                        <select id="category" required>

                            <option value="">
                                Selecione
                            </option>

                            <option value="salary">
                                Salário
                            </option>

                            <option value="food">
                                Alimentação
                            </option>

                            <option value="transport">
                                Transporte
                            </option>

                            <option value="housing">
                                Moradia
                            </option>

                            <option value="education">
                                Educação
                            </option>

                            <option value="leisure">
                                Lazer
                            </option>

                            <option value="other">
                                Outros
                            </option>

                        </select>

                    </div>


                    <!-- Descrição -->

                    <div class="form-group">

                        <label for="description">
                            Descrição
                        </label>

                        <input
                            type="text"
                            id="description"
                            placeholder="Ex.: Salário"
                            required
                        >

                    </div>


                    <!-- Valor -->

                    <div class="form-group">

                        <label for="amount">
                            Valor
                        </label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="0,00"
                            min="0.01"
                            step="0.01"
                            required
                        >

                    </div>


                    <!-- Data -->

                    <div class="form-group">

                        <label for="date">
                            Data
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>

                </div>


                <!--
                    Área onde o JavaScript poderá mostrar
                    mensagens de sucesso ou erro.
                -->
                <p id="formMessage"></p>


                <button type="submit">
                    Adicionar transação
                </button>

                <!--
                    Este botão aparece somente durante uma edição.
                -->
                <button
                    type="button"
                    id="cancelEditButton"
                    class="secondary-button"
                    hidden
                >
                    Cancelar edição
                </button>   

            </form>

        </section>


        <!-- ==========================================
             LISTA DE TRANSAÇÕES
             ========================================== -->

        <section class="card">

            <div class="section-header">

                <h2>Transações</h2>

                <!--
                    No futuro teremos filtros aqui.
                -->

            </div>

            <!--
                O JavaScript irá inserir as transações
                dinamicamente neste elemento.
            -->
            <div id="transactionList">

                <p class="empty-message">
                    Nenhuma transação cadastrada.
                </p>

            </div>

        </section>

    </main>

    <!-- JavaScript da aplicação -->
    <script src="js/app.js"></script>

</body>

</html>
