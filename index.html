<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Define a codificação dos caracteres -->
    <meta charset="UTF-8">

    <!--
        Faz a aplicação se adaptar a celulares,
        tablets e computadores.
    -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finance Dashboard</title>

    <!-- Arquivo de estilos -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- ==================================================
         CONTAINER PRINCIPAL
         ================================================== -->

    <main class="container">


        <!-- ==================================================
             CABEÇALHO
             ================================================== -->

        <header class="header">

            <h1>
                Finance Dashboard
            </h1>

            <p>
                Controle suas receitas e despesas
            </p>

        </header>



        <!-- ==================================================
             RESUMO FINANCEIRO
             ================================================== -->

        <section class="summary">


            <!-- SALDO -->

            <article class="summary-card">

                <span>
                    Saldo
                </span>

                <!--
                    O JavaScript preencherá este valor
                    automaticamente.
                -->

                <strong id="balance">
                    R$ 0,00
                </strong>

            </article>



            <!-- RECEITAS -->

            <article class="summary-card">

                <span>
                    Receitas
                </span>

                <strong id="income">
                    R$ 0,00
                </strong>

            </article>



            <!-- DESPESAS -->

            <article class="summary-card">

                <span>
                    Despesas
                </span>

                <strong id="expense">
                    R$ 0,00
                </strong>

            </article>


        </section>



        <!-- ==================================================
             FORMULÁRIO DE NOVA TRANSAÇÃO
             ================================================== -->

        <section class="card">

            <h2>
                Nova transação
            </h2>


            <form id="transactionForm">


                <!--
                    Utilizamos uma grid para organizar
                    os campos do formulário.
                -->

                <div class="form-grid">


                    <!-- ======================================
                         TIPO
                         ====================================== -->

                    <div class="form-group">

                        <label for="type">
                            Tipo
                        </label>

                        <select
                            id="type"
                            required
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="income">
                                Receita
                            </option>

                            <option value="expense">
                                Despesa
                            </option>

                        </select>

                    </div>



                    <!-- ======================================
                         CATEGORIA
                         ====================================== -->

                    <div class="form-group">

                        <label for="category">
                            Categoria
                        </label>

                        <select
                            id="category"
                            required
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="salary">
                                Salário
                            </option>

                            <option value="food">
                                Alimentação
                            </option>

                            <option value="transport">
                                Transporte
                            </option>

                            <option value="housing">
                                Moradia
                            </option>

                            <option value="education">
                                Educação
                            </option>

                            <option value="leisure">
                                Lazer
                            </option>

                            <option value="other">
                                Outros
                            </option>

                        </select>

                    </div>



                    <!-- ======================================
                         DESCRIÇÃO
                         ====================================== -->

                    <div class="form-group">

                        <label for="description">
                            Descrição
                        </label>

                        <input
                            type="text"
                            id="description"
                            placeholder="Ex.: Salário"
                            required
                        >

                    </div>



                    <!-- ======================================
                         VALOR
                         ====================================== -->

                    <div class="form-group">

                        <label for="amount">
                            Valor
                        </label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="0,00"
                            min="0.01"
                            step="0.01"
                            required
                        >

                    </div>



                    <!-- ======================================
                         DATA
                         ====================================== -->

                    <div class="form-group">

                        <label for="date">
                            Data
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>


                </div>



                <!--
                    Mensagens de sucesso ou erro
                    aparecerão aqui.
                -->

                <p id="formMessage"></p>



                <!-- ======================================
                     BOTÃO PRINCIPAL
                     ====================================== -->

                <button
                    type="submit"
                    id="submitButton"
                >
                    Adicionar transação
                </button>



                <!-- ======================================
                     CANCELAR EDIÇÃO
                     ====================================== -->

                <!--
                    Este botão permanece escondido
                    enquanto não estamos editando.
                -->

                <button
                    type="button"
                    id="cancelEditButton"
                    class="secondary-button"
                    hidden
                >
                    Cancelar edição
                </button>


            </form>

        </section>



        <!-- ==================================================
             LISTA DE TRANSAÇÕES
             ================================================== -->

        <section class="card">


            <div class="section-header">

                <h2>
                    Transações
                </h2>

            </div>



            <!-- ==================================================
                 FILTROS
                 ================================================== -->

            <div class="filters">


                <!-- ======================================
                     FILTRO POR TIPO
                     ====================================== -->

                <div class="form-group">

                    <label for="filterType">
                        Tipo
                    </label>

                    <select id="filterType">

                        <option value="all">
                            Todas
                        </option>

                        <option value="income">
                            Receitas
                        </option>

                        <option value="expense">
                            Despesas
                        </option>

                    </select>

                </div>



                <!-- ======================================
                     FILTRO POR CATEGORIA
                     ====================================== -->

                <div class="form-group">

                    <label for="filterCategory">
                        Categoria
                    </label>

                    <select id="filterCategory">

                        <option value="all">
                            Todas
                        </option>

                        <option value="salary">
                            Salário
                        </option>

                        <option value="food">
                            Alimentação
                        </option>

                        <option value="transport">
                            Transporte
                        </option>

                        <option value="housing">
                            Moradia
                        </option>

                        <option value="education">
                            Educação
                        </option>

                        <option value="leisure">
                            Lazer
                        </option>

                        <option value="other">
                            Outros
                        </option>

                    </select>

                </div>



                <!-- ======================================
                     PESQUISA
                     ====================================== -->

                <div class="form-group">

                    <label for="searchInput">
                        Buscar
                    </label>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Ex.: mercado"
                    >

                </div>


            </div>



            <!-- ==================================================
                 BOTÃO APLICAR FILTROS
                 ================================================== -->

            <!--
                IMPORTANTE:

                Este ID precisa ser exatamente:
                applyFiltersButton

                O app.js procura esse elemento
                para executar os filtros.
            -->

            <button
                type="button"
                id="applyFiltersButton"
            >
                Aplicar filtros
            </button>



            <!-- ==================================================
                 LISTA
                 ================================================== -->

            <!--
                O JavaScript criará as transações
                dinamicamente dentro deste elemento.
            -->

            <div id="transactionList">

                <p class="empty-message">
                    Nenhuma transação cadastrada.
                </p>

            </div>


        </section>


    </main>



    <!-- ==================================================
         JAVASCRIPT
         ================================================== -->

    <!--
        O app.js controla toda a lógica da aplicação:
        cadastro, edição, exclusão, filtros e cálculos.
    -->

    <script src="js/app.js"></script>


</body>

</html>
